[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flaky-finder"
version = "0.1.0"
description = "反复跑测试，找出哪个用例在捣鬼：输出每个用例的通过率，区分「flaky」和「真的坏了」"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xingaorpw" }]
keywords = ["flaky", "testing", "ci", "pytest", "test-reliability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
flakyfinder = "flakyfinder.cli:main"

[project.urls]
Homepage = "https://github.com/xingaorpw/flaky-finder"
Issues = "https://github.com/xingaorpw/flaky-finder/issues"

[tool.setuptools]
packages = ["flakyfinder"]
