name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: 单元 + 端到端测试
        run: python -m unittest discover -s tests -t . -v

  demo:
    name: 端到端冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装
        run: python -m pip install -e .

      - name: 对一个真的会抖的套件跑 4 次
        run: |
          mkdir -p /tmp/suite
          cat > /tmp/suite/t.py <<'PY'
          import pathlib, sys
          counter = pathlib.Path("/tmp/suite/count")
          n = int(counter.read_text()) if counter.exists() else 0
          counter.write_text(str(n + 1))
          if n % 2 == 0:
              print("not ok 1 - sometimes_fails"); sys.exit(1)
          print("ok 1 - sometimes_fails")
          PY
          flakyfinder run --runs 4 --format tap --fail-on-flaky -- "python /tmp/suite/t.py"
